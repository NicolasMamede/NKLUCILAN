<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo | Semana</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="app">

        <!-- ========================================
             SIDEBAR
        ========================================= -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-logo">

                <div class="logo-simbolo">
                    N
                </div>

                <span>NEXO</span>

            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    <span class="menu-icone">⌂</span>
                    <span>Início</span>
                </a>

                <a href="semana.html" class="menu-item ativo">
                    <span class="menu-icone">▣</span>
                    <span>Semana</span>
                </a>

                <a href="mes.html" class="menu-item">
                    <span class="menu-icone">□</span>
                    <span>Mês</span>
                </a>

                <a href="atividades.html" class="menu-item">
                    <span class="menu-icone">✓</span>
                    <span>Atividades</span>
                </a>

                <a href="provas.html" class="menu-item">
                    <span class="menu-icone">✎</span>
                    <span>Provas</span>
                </a>

                <a href="trabalhos.html" class="menu-item">
                    <span class="menu-icone">▤</span>
                    <span>Trabalhos</span>
                </a>

                <a href="estudos.html" class="menu-item">
                    <span class="menu-icone">◎</span>
                    <span>Estudos</span>
                </a>

                <a href="materias.html" class="menu-item">
                    <span class="menu-icone">◫</span>
                    <span>Matérias</span>
                </a>

            
                <div class="menu-secao">
                    COMPARTILHADO
                </div>

                <a href="agenda-publica.html" class="menu-item">
                    <span class="menu-icone">◇</span>
                    <span>Agenda Pública</span>
                </a>

            </nav>


<div class="sidebar-usuario">

    <button
        class="usuario-botao"
        id="usuarioBotao"
        type="button"
    >

        <div
            class="usuario-avatar"
            id="usuarioAvatar"
        >
            U
        </div>

        <div class="usuario-info">

            <strong id="usuarioNome">
                Usuário
            </strong>

            <span>
                Minha conta
            </span>

        </div>

        <span class="usuario-seta">
            ›
        </span>

    </button>

</div>

        </aside>


        <!-- ========================================
             CONTEÚDO
        ========================================= -->

        <main class="conteudo">

            <header class="topo">

                <button
                    type="button"
                    class="menu-mobile"
                    id="menuMobile"
                    aria-label="Abrir menu"
                >
                    ☰
                </button>

                <div class="topo-data">

                    <span>
                        Planejamento semanal
                    </span>

                </div>

            </header>


            <div class="dashboard">

                <!-- ========================================
                     CABEÇALHO
                ========================================= -->

                <section class="semana-cabecalho">

                    <div>

                        <span class="pagina-etiqueta">
                            PLANEJAMENTO
                        </span>

                        <h1>
                            Minha semana
                        </h1>

                        <p id="periodoSemana">
                            Carregando semana...
                        </p>

                    </div>


                    <div class="semana-navegacao">

                        <button
                            type="button"
                            class="semana-hoje"
                            id="semanaHoje"
                        >
                            Hoje
                        </button>

                        <button
                            type="button"
                            class="semana-seta"
                            id="semanaAnterior"
                            aria-label="Semana anterior"
                        >
                            ‹
                        </button>

                        <button
                            type="button"
                            class="semana-seta"
                            id="semanaProxima"
                            aria-label="Próxima semana"
                        >
                            ›
                        </button>

                    </div>

                </section>


                <!-- ========================================
                     LEGENDA
                ========================================= -->

                <div class="semana-legenda">

                    <span>
                        <i class="legenda-atividade"></i>
                        Atividade
                    </span>

                    <span>
                        <i class="legenda-prova"></i>
                        Prova
                    </span>

                </div>


                <!-- ========================================
                     SEMANA
                ========================================= -->

                <section
                    class="semana-grade"
                    id="semanaGrade"
                >
                </section>

            </div>

        </main>

    </div>


    <!-- ========================================
         MODAL ESCOLHER TIPO
    ========================================= -->

    <div
        class="modal-fundo"
        id="modalDiaSemana"
    >

        <div class="modal">

            <div class="modal-cabecalho">

                <div>

                    <span id="modalDiaData">
                        DATA
                    </span>

                    <h2>
                        Adicionar neste dia
                    </h2>

                </div>

                <button
                    type="button"
                    class="modal-fechar"
                    id="fecharModalDiaSemana"
                >
                    ×
                </button>

            </div>


            <div class="modal-opcoes">

                <button
                    type="button"
                    class="modal-opcao"
                    id="criarAtividadeSemana"
                >

                    <div class="modal-opcao-icone">
                        ✓
                    </div>

                    <div>

                        <strong>
                            Atividade
                        </strong>

                        <span>
                            Criar uma atividade para este dia.
                        </span>

                    </div>

                </button>


                <button
                    type="button"
                    class="modal-opcao"
                    id="criarProvaSemana"
                >

                    <div class="modal-opcao-icone">
                        ✎
                    </div>

                    <div>

                        <strong>
                            Prova
                        </strong>

                        <span>
                            Adicionar uma prova para este dia.
                        </span>

                    </div>

                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         MODAL NOVA ATIVIDADE
    ========================================= -->

    <div
        class="modal-fundo"
        id="modalAtividadeSemana"
    >

        <div class="modal">

            <div class="modal-cabecalho">

                <div>

                    <span>
                        ATIVIDADE
                    </span>

                    <h2>
                        Nova atividade
                    </h2>

                </div>

                <button
                    type="button"
                    class="modal-fechar"
                    id="fecharAtividadeSemana"
                >
                    ×
                </button>

            </div>


            <form
                class="formulario-nexo"
                id="formAtividadeSemana"
            >

                <div class="formulario-campo">

                    <label for="tituloAtividadeSemana">
                        Título
                    </label>

                    <input
                        type="text"
                        id="tituloAtividadeSemana"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="formulario-campo">

                    <label for="dataAtividadeSemana">
                        Data
                    </label>

                    <input
                        type="date"
                        id="dataAtividadeSemana"
                        required
                    >

                </div>


                <div class="formulario-campo">

                    <label for="materiaAtividadeSemana">
                        Matéria
                    </label>

                    <select id="materiaAtividadeSemana">
                    </select>

                </div>


                <div class="formulario-campo">

                    <label for="horarioAtividadeSemana">
                        Horário (opcional)
                    </label>

                    <input
                        type="time"
                        id="horarioAtividadeSemana"
                    >

                </div>


                <div class="formulario-campo">

                    <label for="descricaoAtividadeSemana">
                        Descrição (opcional)
                    </label>

                    <textarea
                        id="descricaoAtividadeSemana"
                        rows="4"
                        maxlength="500"
                    ></textarea>

                </div>
                <!-- CALENDÁRIO -->

                <label class="calendario-opcao">
                    <input type="checkbox" id="atividadeSemanaNoCalendario">
                    <span>
                        <strong>Adicionar ao meu calendário</strong>
                        <small>Mostra este item no Dashboard, Semana e Mês.</small>
                    </span>
                </label>




                <div class="formulario-botoes">

                    <button
                        type="button"
                        class="botao-cancelar"
                        id="cancelarAtividadeSemana"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="botao-salvar"
                    >
                        Criar atividade
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ========================================
         MODAL NOVA PROVA
    ========================================= -->

    <div
        class="modal-fundo"
        id="modalProvaSemana"
    >

        <div class="modal">

            <div class="modal-cabecalho">

                <div>

                    <span>
                        PROVA
                    </span>

                    <h2>
                        Nova prova
                    </h2>

                </div>

                <button
                    type="button"
                    class="modal-fechar"
                    id="fecharProvaSemana"
                >
                    ×
                </button>

            </div>


            <form
                class="formulario-nexo"
                id="formProvaSemana"
            >

                <div class="formulario-campo">

                    <label for="nomeProvaSemana">
                        Nome da prova
                    </label>

                    <input
                        type="text"
                        id="nomeProvaSemana"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="formulario-campo">

                    <label for="dataProvaSemana">
                        Data
                    </label>

                    <input
                        type="date"
                        id="dataProvaSemana"
                        required
                    >

                </div>


                <div class="formulario-campo">

                    <label for="materiaProvaSemana">
                        Matéria
                    </label>

                    <select id="materiaProvaSemana">
                    </select>

                </div>


                <div class="formulario-campo">

                    <label for="horarioProvaSemana">
                        Horário (opcional)
                    </label>

                    <input
                        type="time"
                        id="horarioProvaSemana"
                    >

                </div>


                <div class="formulario-campo">

                    <label for="conteudoProvaSemana">
                        Conteúdo / observações (opcional)
                    </label>

                    <textarea
                        id="conteudoProvaSemana"
                        rows="4"
                        maxlength="700"
                    ></textarea>

                </div>
                <!-- CALENDÁRIO -->

                <label class="calendario-opcao">
                    <input type="checkbox" id="provaSemanaNoCalendario">
                    <span>
                        <strong>Adicionar ao meu calendário</strong>
                        <small>Mostra este item no Dashboard, Semana e Mês.</small>
                    </span>
                </label>




                <div class="formulario-botoes">

                    <button
                        type="button"
                        class="botao-cancelar"
                        id="cancelarProvaSemana"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="botao-salvar"
                    >
                        Criar prova
                    </button>

                </div>

            </form>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/usuario.js"></script>
<script src="js/semana.js"></script>

<script src="js/nexo-extras.js"></script>
</body>

</html>
